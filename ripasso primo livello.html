    const nextBtn = document.getElementById('next');
    const progressEl = document.getElementById('progress');

    // Algoritmo per mischiare l'ordine delle domande
    for (let i = quizData.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [quizData[i], quizData[j]] = [quizData[j], quizData[i]];
    }

    function loadQuestion() {
        nextBtn.style.display = 'none';
        progressEl.innerText = `Domanda ${currentQ + 1} di ${quizData.length}`;
        const q = quizData[currentQ];
        questionEl.innerText = q.q;
        optionsEl.innerHTML = '';
        
        let opzioni = q.o.map((opt, index) => ({ testo: opt, isCorrect: (index === q.a) }));
        
        // Algoritmo per mischiare l'ordine delle opzioni (A, B, C)
        for (let i = opzioni.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opzioni[i], opzioni[j]] = [opzioni[j], opzioni[i]];
        }
        
        opzioni.forEach((optObj) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = optObj.testo;
            
            if (optObj.isCorrect) {
                btn.dataset.correct = "true";
            }
            
            btn.onclick = () => selectOption(btn, optObj.isCorrect);
            optionsEl.appendChild(btn);
        });
    }

    function selectOption(btn, isCorrect) {
        const buttons = optionsEl.querySelectorAll('.option');
        buttons.forEach(b => {

        });

            score++;
        } else {
            btn.classList.add('wrong');
            const correctBtn = optionsEl.querySelector('[data-correct="true"]');
            if (correctBtn) correctBtn.classList.add('correct');
        }
        nextBtn.style.display = 'block';
    }

    nextBtn.onclick = () => {
        currentQ++;
        if (currentQ < quizData.length) {
            loadQuestion();
        } else {
            container.innerHTML = `
                <div class="result-container">
                    <h2>Risultato Finale</h2>
                    <p>Hai completato l'esercizio!</p>
                    <div class="result-score">${score} / ${quizData.length}</div>
                    <button class="next-btn" style="display:block;" onclick="location.reload()">Riprova</button>
                </div>`;
        }
    };

    // Inizializza il quiz
    loadQuestion();
</script>

</body>
</html>
